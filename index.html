<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&family=Noto+Serif+JP:wght@300;400;600&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-gold: #c5a059;
            --color-bg: #fdfcf8; 
            --color-text: #333333;
            --slide-width: 65vw;
            --slide-margin: 3vw;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            /* 画面が小さい場合に縦スクロールができるように変更 */
            min-height: 100vh;
            overflow-x: hidden;
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
            letter-spacing: 0.08em;
        }

        .sans { font-family: 'Zen Kaku Gothic New', sans-serif; }
        
        .tategaki {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        /* 常に左上に追従する設定（fixed） */
        .back-btn {
            position: fixed;
            top: 4vh;
            left: 4vw;
            z-index: 999;
            color: var(--color-text);
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            /* スマホ等でスクロール時に被っても読めるように、薄いすりガラス背景を敷く */
            background: rgba(253, 252, 248, 0.7);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 30px;
        }
        .back-btn:hover {
            opacity: 0.6;
        }
        
        /* PCでは背景を消してスッキリ見せる */
        @media (min-width: 769px) {
            .back-btn {
                background: transparent;
                backdrop-filter: none;
                padding: 0;
                border-radius: 0;
            }
        }

        /* スライダー領域の設定 */
        .slider-viewport {
            position: relative;
            width: 100%;
            height: 100vh; /* PCは全画面 */
            display: flex;
            align-items: center;
            overflow: hidden;
            background-image: repeating-linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%, #f0f0f0), repeating-linear-gradient(45deg, #f0f0f0 25%, #fdfcf8 25%, #fdfcf8 75%, #f0f0f0 75%, #f0f0f0);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
        }

        .slider-viewport::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(253,252,248,0.8) 100%);
            pointer-events: none;
            z-index: 10;
        }

        .slider-track {
            display: flex;
            align-items: center;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
            z-index: 20;
        }

        .slide {
            flex: 0 0 var(--slide-width);
            height: 70vh; 
            margin: 0 var(--slide-margin);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.8s ease;
            opacity: 0.15;
            transform: scale(0.85);
            filter: grayscale(100%) opacity(0.5); 
        }

        .slide.active {
            opacity: 1;
            transform: scale(1);
            filter: grayscale(0%) opacity(1);
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(197, 160, 89, 0.3);
            background-color: #fff; 
            padding: 4px; 
        }

        /* 矢印の基本デザイン */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            border: 1px solid var(--color-gold);
            cursor: pointer;
            width: 48px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--color-gold);
            border-radius: 50%;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        @media (hover: hover) {
            .nav-arrow:hover {
                color: #fff;
                background: var(--color-gold);
                transform: translateY(-50%) scale(1.05);
            }
        }
        
        @media (hover: none) {
            .nav-arrow:active {
                background: rgba(197, 160, 89, 0.2);
                transform: translateY(-50%) scale(0.95);
            }
        }

        .arrow-left { left: 4vw; }
        .arrow-right { right: 4vw; }

        .dots {
            position: absolute;
            bottom: 6vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            z-index: 100;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #e5e7eb;
            transition: all 0.5s;
            cursor: pointer;
        }
        .dot.active {
            background-color: var(--color-gold);
            transform: scale(1.8);
        }

        /* PC版：テキスト類を絶対配置で浮かせる */
        .title-overlay {
            position: absolute;
            top: 6vh;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
            pointer-events: none;
        }

        .category-info {
            position: absolute;
            bottom: 8vh;
            left: 5vw;
            z-index: 100;
            pointer-events: none;
            animation: fadeIn 1.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           スマホ（SP）用の完璧な再設計（縦積みレイアウト）
           ========================================= */
        @media (max-width: 768px) {
            :root {
                --slide-width: 78vw; 
                --slide-margin: 3vw;
            }
            
            body {
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
            }

            .title-overlay {
                display: none; 
            }

            /* テキスト情報：下部の余白を0にして、間延びを完全に防ぐ */
            .category-info {
                position: relative;
                bottom: auto; left: auto; top: auto; transform: none;
                width: 100%;
                /* 上:10vh(BACKボタン回避), 左右:6vw, 下:0 */
                padding: 10vh 6vw 0 6vw; 
                text-align: center;
                animation: fadeInSP 1.5s ease-out forwards;
                z-index: 50;
            }
            @keyframes fadeInSP {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }

            .category-info h2 {
                font-size: 1.6rem; 
                margin-bottom: 0.8rem;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .category-info h2 span {
                margin-left: 0;
                margin-top: 0.3rem;
                display: block;
            }
            .category-info p {
                font-size: 10px;
                /* 行間を少し詰めてスッキリと見せる */
                line-height: 2.0; 
            }

            /* スライダー本体：上詰めにしてテキストとの距離を固定 */
            .slider-viewport {
                height: auto;
                flex-grow: 1;
                /* ★ここで上詰め(flex-start)にし、余白が勝手に伸びるのを防ぐ */
                align-items: flex-start; 
                /* テキストと画像の隙間をここで直接コントロール */
                padding-top: 3vh; 
                padding-bottom: 0; 
            }

            .slider-track {
                padding-top: 0; 
            }

            .slide {
                /* スマホでの画像の高さを指定 */
                height: 52vh; 
                margin-top: 0;
            }

            /* ★矢印の配置：画像の高さに合わせて完璧な中央に置く★ 
               計算式：上部の隙間(3vh) + 画像の半分の高さ(52vh ÷ 2) = 29vh
            */
            .nav-arrow {
                top: 29vh; 
                width: 36px;
                height: 36px;
                transform: translateY(-50%);
            }
            @media (hover: none) {
                .nav-arrow:active {
                    transform: translateY(-50%) scale(0.95);
                }
            }
            
            .arrow-left { left: 2vw; }
            .arrow-right { right: 2vw; }
            
            .dots {
                bottom: 6vh;
            }
        }
    </style>
</head>
<body>

    <!-- 常に左上に追従するBACKボタン -->
    <a href="https://nakazu201-oss.github.io/my-ai-blog-/" class="back-btn sans uppercase">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        BACK TO PROFILE
    </a>

    <!-- PC用：タイトル装飾 -->
    <div class="title-overlay">
        <h1 class="text-[10px] md:text-xs tracking-[0.5em] md:tracking-[0.8em] uppercase text-gray-400 sans">
            Photography Archive
        </h1>
        <div class="w-[1px] h-6 bg-[#c5a059] mx-auto mt-3 opacity-50 md:block hidden"></div>
    </div>

    <!-- コンセプト文エリア（スマホでは上部、PCでは左下） -->
    <div class="category-info">
        <div class="flex items-center gap-3 mb-2 justify-center md:justify-start">
            <span class="w-6 h-[1px] bg-[#c5a059]"></span>
            <span class="text-[#c5a059] text-[9px] md:text-[10px] tracking-[0.4em] sans uppercase">Category 01</span>
            <span class="w-6 h-[1px] bg-[#c5a059]"></span>
        </div>
        <h2 class="text-2xl md:text-4xl font-medium tracking-[0.2em] text-gray-800 mb-3 md:mb-4">STILL LIFE<span class="block text-[10px] md:text-xs text-gray-400 tracking-[0.5em] mt-1 sans md:inline md:ml-4">- 静物 -</span></h2>
        <p class="text-[10px] md:text-xs text-gray-600 tracking-[0.2em] leading-loose sans text-center md:text-left">
            素材の呼吸を聴き、隠された表情を引き出す。<br>
            質感、温度、そこに宿る物語。<br>
            光と影の対話が、物の本質を浮き彫りにする。
        </p>
    </div>

    <!-- スライダーエリア -->
    <div class="slider-viewport">
        <button class="nav-arrow arrow-left" onclick="moveSlide(-1)" aria-label="Previous">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>

        <div id="sliderTrack" class="slider-track">
            <!-- インデックス: 0 -->
            <div class="slide"><img src="mono%20(2).jpg" alt="作品 2"></div>
            <!-- インデックス: 1 -->
            <div class="slide"><img src="mono%20(11).jpg" alt="作品 11"></div> 
            <!-- インデックス: 2 (ここからスタート / 画像7と12をチェンジ) -->
            <div class="slide"><img src="mono%20(12).jpg" alt="作品 12"></div>
            <!-- インデックス: 3 (画像5と6をチェンジ) -->
            <div class="slide"><img src="mono%20(6).jpg" alt="作品 6"></div>
            <!-- インデックス: 4 -->
            <div class="slide"><img src="mono%20(9).jpg" alt="作品 9"></div>
            <!-- インデックス: 5 (画像4と13をチェンジ) -->
            <div class="slide"><img src="mono%20(13).jpg" alt="作品 13"></div>
        </div>

        <button class="nav-arrow arrow-right" onclick="moveSlide(1)" aria-label="Next">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>

        <div id="dotsContainer" class="dots"></div>
    </div>

    <script>
        const track = document.getElementById('sliderTrack');
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.getElementById('dotsContainer');
        
        // ★初期表示のインデックスを「2」（3番目の要素である画像12）に設定
        let currentIndex = 2;

        slides.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            dot.addEventListener('click', () => {
                currentIndex = i;
                updateSlider();
            });
            dotsContainer.appendChild(dot);
        });
        const dots = document.querySelectorAll('.dot');

        function updateSlider() {
            const rootStyles = getComputedStyle(document.documentElement);
            const slideWidthVW = parseFloat(rootStyles.getPropertyValue('--slide-width'));
            const slideMarginVW = parseFloat(rootStyles.getPropertyValue('--slide-margin'));
            
            const totalSlideWidthVW = slideWidthVW + (slideMarginVW * 2);
            
            const centerOffsetVW = (100 - totalSlideWidthVW) / 2;
            const targetX = -(currentIndex * totalSlideWidthVW) + centerOffsetVW;
            
            track.style.transform = `translateX(${targetX}vw)`;

            slides.forEach((slide, index) => {
                const isActive = index === currentIndex;
                slide.classList.toggle('active', isActive);
                dots[index].classList.toggle('active', isActive);
            });
        }

        function moveSlide(direction) {
            currentIndex += direction;
            
            // 無限ループ
            if (currentIndex < 0) {
                currentIndex = slides.length - 1;
            } else if (currentIndex >= slides.length) {
                currentIndex = 0;
            }
            
            updateSlider();
        }

        window.onload = updateSlider;
        window.onresize = () => {
            setTimeout(updateSlider, 100);
        };

        // スワイプ操作
        let touchStartX = 0;
        let touchEndX = 0;
        const sliderViewport = document.querySelector('.slider-viewport');

        sliderViewport.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        sliderViewport.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            const threshold = 50; 
            if (touchEndX < touchStartX - threshold) {
                moveSlide(1);
            }
            if (touchEndX > touchStartX + threshold) {
                moveSlide(-1);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') moveSlide(-1);
            if (e.key === 'ArrowRight') moveSlide(1);
        });
    </script>
</body>
</html>
