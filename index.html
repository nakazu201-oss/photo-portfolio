<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&family=Noto+Serif+JP:wght@300;400;600&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-gold: #c5a059;
            --color-bg: #fdfcf8; 
            --color-text: #333333;
            --slide-width: 65vw;
            --slide-margin: 3vw;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
            letter-spacing: 0.08em;
        }

        .sans { font-family: 'Zen Kaku Gothic New', sans-serif; }
        
        /* 常に左上に追従する設定 */
        .back-btn {
            position: fixed;
            top: 4vh;
            left: 4vw;
            z-index: 999;
            color: var(--color-text);
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            background: rgba(253, 252, 248, 0.7);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 30px;
        }
        .back-btn:hover {
            opacity: 0.6;
        }
        @media (min-width: 769px) {
            .back-btn {
                background: transparent;
                backdrop-filter: none;
                padding: 0;
                border-radius: 0;
            }
        }

        /* セクションごとの枠組み */
        .portfolio-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
        }

        /* PC用：タイトル装飾 */
        .title-overlay {
            position: absolute;
            top: 6vh;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
            pointer-events: none;
        }

        .category-info {
            position: absolute;
            bottom: 8vh;
            left: 5vw;
            z-index: 100;
            pointer-events: none;
        }

        /* スライダー領域の設定 */
        .slider-viewport {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            overflow: hidden;
            background-image: repeating-linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%, #f0f0f0), repeating-linear-gradient(45deg, #f0f0f0 25%, #fdfcf8 25%, #fdfcf8 75%, #f0f0f0 75%, #f0f0f0);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
        }

        .slider-viewport::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(253,252,248,0.8) 100%);
            pointer-events: none;
            z-index: 10;
        }

        .slider-track {
            display: flex;
            align-items: center;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
            z-index: 20;
        }

        .slide {
            flex: 0 0 var(--slide-width);
            height: auto; 
            max-height: 70vh;
            margin: 0 var(--slide-margin);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.8s ease;
            opacity: 0.15;
            transform: scale(0.85);
            filter: grayscale(100%) opacity(0.5); 
        }

        .slide.active {
            opacity: 1;
            transform: scale(1);
            filter: grayscale(0%) opacity(1);
        }

        .slide img {
            max-width: 100%;
            max-height: 70vh;
            height: auto; 
            width: auto;
            object-fit: contain;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(197, 160, 89, 0.3);
            background-color: #fff; 
            padding: 4px; 
        }

        /* 矢印のデザイン */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            border: 1px solid var(--color-gold);
            cursor: pointer;
            width: 48px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--color-gold);
            border-radius: 50%;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        @media (hover: hover) {
            .nav-arrow:hover {
                color: #fff;
                background: var(--color-gold);
                transform: translateY(-50%) scale(1.05);
            }
        }
        .arrow-left { left: 4vw; }
        .arrow-right { right: 4vw; }

        /* ドット（インジケーター）のデザイン */
        .dots {
            position: absolute;
            bottom: 6vh;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 16px;
            z-index: 100;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #e5e7eb;
            transition: all 0.5s;
            cursor: pointer;
        }
        .dot.active {
            background-color: var(--color-gold);
            transform: scale(1.8);
        }

        /* =========================================
           スマホ（SP）用の調整
           ========================================= */
        @media (max-width: 768px) {
            :root {
                --slide-width: 85vw; 
                --slide-margin: 2vw;
            }

            .title-overlay { display: none; }

            .category-info {
                position: relative;
                bottom: auto; left: auto; top: auto; transform: none;
                width: 100%;
                padding: 12vh 6vw 2vh 6vw; 
                text-align: center;
                z-index: 50;
            }

            .category-info h2 {
                font-size: 1.6rem; 
                margin-bottom: 0.8rem;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .category-info h2 span {
                margin-left: 0;
                margin-top: 0.3rem;
                display: block;
            }
            .category-info p {
                font-size: 10px;
                line-height: 2.0; 
            }

            .slider-viewport {
                height: auto;
                min-height: 60vh;
                padding-bottom: 8vh;
            }

            .slide img {
                max-height: 65vh;
                width: auto;
                max-width: 100%;
            }

            .nav-arrow {
                top: calc(50% - 4vh); 
                width: 36px;
                height: 36px;
            }
            .arrow-left { left: 2vw; }
            .arrow-right { right: 2vw; }
            .dots { bottom: 2vh; }
        }
    </style>
</head>
<body>

    <a href="https://nakazu201-oss.github.io/my-ai-blog-/" class="back-btn sans uppercase">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        BACK TO PROFILE
    </a>

    <section class="portfolio-section" id="slider1">
        <div class="title-overlay">
            <h1 class="text-[10px] md:text-xs tracking-[0.5em] md:tracking-[0.8em] uppercase text-gray-400 sans">
                Photography Archive
            </h1>
            <div class="w-[1px] h-6 bg-[#c5a059] mx-auto mt-3 opacity-50 md:block hidden"></div>
        </div>

        <div class="category-info">
            <div class="flex items-center gap-3 mb-2 justify-center md:justify-start">
                <span class="w-6 h-[1px] bg-[#c5a059]"></span>
                <span class="text-[#c5a059] text-[9px] md:text-[10px] tracking-[0.4em] sans uppercase">Category 01</span>
                <span class="w-6 h-[1px] bg-[#c5a059]"></span>
            </div>
            <h2 class="text-2xl md:text-4xl font-medium tracking-[0.2em] text-gray-800 mb-3 md:mb-4">STILL LIFE<span class="block text-[10px] md:text-xs text-gray-400 tracking-[0.5em] mt-1 sans md:inline md:ml-4">- 静物 -</span></h2>
            <p class="text-[10px] md:text-xs text-gray-600 tracking-[0.2em] leading-loose sans text-center md:text-left">
                素材の呼吸を聴き、隠された表情を引き出す。<br>
                質感、温度、そこに宿る物語。<br>
                光と影の対話が、物の本質を浮き彫りにする。
            </p>
        </div>

        <div class="slider-viewport">
            <button class="nav-arrow arrow-left" aria-label="Previous">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>

            <div class="slider-track">
                <div class="slide"><img src="mono2.jpg" alt="作品 2"></div>
                <div class="slide"><img src="mono11.jpg" alt="作品 11"></div> 
                <div class="slide"><img src="mono12.jpg" alt="作品 12"></div>
                <div class="slide"><img src="mono6.jpg" alt="作品 6"></div>
                <div class="slide"><img src="mono9.jpg" alt="作品 9"></div>
                <div class="slide"><img src="mono13.jpg" alt="作品 13"></div>
            </div>

            <button class="nav-arrow arrow-right" aria-label="Next">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
            <div class="dots"></div>
        </div>
    </section>
    <section class="portfolio-section" id="slider2">
        <div class="title-overlay">
            <div class="w-[1px] h-12 bg-[#c5a059] mx-auto mt-0 opacity-30 md:block hidden"></div>
        </div>

        <div class="category-info">
            <div class="flex items-center gap-3 mb-2 justify-center md:justify-start">
                <span class="w-6 h-[1px] bg-[#c5a059]"></span>
                <span class="text-[#c5a059] text-[9px] md:text-[10px] tracking-[0.4em] sans uppercase">Category 02</span>
                <span class="w-6 h-[1px] bg-[#c5a059]"></span>
            </div>
            <h2 class="text-2xl md:text-4xl font-medium tracking-[0.2em] text-gray-800 mb-3 md:mb-4">PORTRAIT<span class="block text-[10px] md:text-xs text-gray-400 tracking-[0.5em] mt-1 sans md:inline md:ml-4">- 人物 -</span></h2>
            <p class="text-[10px] md:text-xs text-gray-600 tracking-[0.2em] leading-loose sans text-center md:text-left">
                その瞬間にしかない感情を、光の中に閉じ込める。<br>
                瞳の奥に宿る真実、かすかな息遣い。<br>
                レンズ越しに交わす、言葉なき対話。
            </p>
        </div>

        <div class="slider-viewport">
            <button class="nav-arrow arrow-left" aria-label="Previous">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>

            <div class="slider-track">
                <div class="slide"><img src="pt0.jpg" alt="ポートレート 0"></div>
                <div class="slide"><img src="pt3.jpg" alt="ポートレート 3"></div> 
                <div class="slide"><img src="pt6.JPG" alt="ポートレート 6"></div>
                <div class="slide"><img src="pt8.JPG" alt="ポートレート 8"></div>
                <div class="slide"><img src="pt11.JPG" alt="ポートレート 11"></div>
                <div class="slide"><img src="pt12.jpg" alt="ポートレート 12"></div>
                <div class="slide"><img src="pt13.jpg" alt="ポートレート 13"></div>
                <div class="slide"><img src="pt16.jpg" alt="ポートレート 16"></div>
            </div>

            <button class="nav-arrow arrow-right" aria-label="Next">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
            <div class="dots"></div>
        </div>
    </section>
    <script>
        // ページ内のすべてのポートフォリオセクションを取得
        const sections = document.querySelectorAll('.portfolio-section');

        // 各セクションごとにスライダーの機能を設定（独立して動くようにする）
        sections.forEach((section) => {
            const track = section.querySelector('.slider-track');
            const slides = section.querySelectorAll('.slide');
            const dotsContainer = section.querySelector('.dots');
            const prevBtn = section.querySelector('.arrow-left');
            const nextBtn = section.querySelector('.arrow-right');
            const sliderViewport = section.querySelector('.slider-viewport');
            
            // 各スライダーの真ん中あたりの画像からスタートさせる
            let currentIndex = Math.floor(slides.length / 2);
            let dots = [];

            // ドットの生成
            slides.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                dot.addEventListener('click', () => {
                    currentIndex = i;
                    updateSlider();
                });
                dotsContainer.appendChild(dot);
                dots.push(dot);
            });

            function updateSlider() {
                const rootStyles = getComputedStyle(document.documentElement);
                const slideWidthVW = parseFloat(rootStyles.getPropertyValue('--slide-width'));
                const slideMarginVW = parseFloat(rootStyles.getPropertyValue('--slide-margin'));
                
                const totalSlideWidthVW = slideWidthVW + (slideMarginVW * 2);
                const centerOffsetVW = (100 - totalSlideWidthVW) / 2;
                const targetX = -(currentIndex * totalSlideWidthVW) + centerOffsetVW;
                
                track.style.transform = `translateX(${targetX}vw)`;

                slides.forEach((slide, index) => {
                    const isActive = index === currentIndex;
                    slide.classList.toggle('active', isActive);
                    dots[index].classList.toggle('active', isActive);
                });
            }

            function moveSlide(direction) {
                currentIndex += direction;
                if (currentIndex < 0) {
                    currentIndex = slides.length - 1;
                } else if (currentIndex >= slides.length) {
                    currentIndex = 0;
                }
                updateSlider();
            }

            // ボタンのクリックイベント
            prevBtn.addEventListener('click', () => moveSlide(-1));
            nextBtn.addEventListener('click', () => moveSlide(1));

            // 初回表示のセットアップ
            updateSlider();
            
            // 画面サイズ変更時の再計算
            window.addEventListener('resize', () => {
                setTimeout(updateSlider, 100);
            });

            // スワイプ操作（スマホ対応）
            let touchStartX = 0;
            let touchEndX = 0;

            sliderViewport.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            }, {passive: true});

            sliderViewport.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                const threshold = 50; 
                if (touchEndX < touchStartX - threshold) moveSlide(1);
                if (touchEndX > touchStartX + threshold) moveSlide(-1);
            }, {passive: true});
        });
    </script>
</body>
</html>
